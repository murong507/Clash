# --- 锚点定义 (通用属性) ---
proxy_providers_common:
  &p {
    type: http,
    interval: 86400,
    proxy: DIRECT,
    health-check:
      {
        enable: true,
        url: https://g.cn/generate_204,
        interval: 600,
        lazy: true,
      },
  }

# 全局过滤节点
exclude:
  &exclude {
    exclude-filter: '群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|禁止|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|⚠️|@|Expire|http|com',
  }

# 订阅提供者，如果你想要添加多个订阅提供者，可以复制 provider1 的配置块，并修改 url 和 path 字段。
proxy-providers:
  provider1:
    <<: [*p, *exclude]
    url: '此处填入机场订阅链接'
    path: ./proxy_providers/provider1.yaml
#  provider2:
#   <<: [*p, *exclude]
#   url: '此处填入机场订阅链接'
#   path: ./proxy_providers/provider2.yaml

# --- 基础全局配置 ---

allow-lan: true
ipv6: true
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 60
find-process-mode: strict
external-controller: '[::]:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'

profile:
  store-selected: true
  store-fake-ip: true

# 国内外 DNS 定义
chinaDNS:
  &chinaDNS [
    'https://dns.alidns.com/dns-query#DIRECT',
    'https://doh.pub/dns-query#DIRECT',
  ]
foreignDNS:
  &foreignDNS [
    'https://dns.cloudflare.com/dns-query#默认代理',
    'https://dns.google/dns-query#默认代理',
  ]

dns:
  enable: true
  ipv6: true
  listen: :1053
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range-v6: 'fc00::/18'
  fake-ip-filter:
    - 'rule-set:fakeip_filter'
  proxy-server-nameserver: 
    - '223.5.5.5'
    - '119.29.29.29'
  default-nameserver:
    - '223.5.5.5'
    - '119.29.29.29'
  direct-nameserver:
    - 'system'
    - '223.5.5.5'
    - '119.29.29.29'

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']

  # 解决谷歌商店无法下载的问题
  'services.googleapis.cn': ['services.googleapis.com']

  # 屏蔽哔哩哔哩PCDN，解决访问视频卡顿问题
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']

ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60

tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['udp://any:53', 'tcp://any:53']

# --- 规则集 ---

# Rule Provider 通用配置
rule_providers_common:
  rp_domain: &rp_domain { type: http, interval: 86400, behavior: domain }
  rp_ip: &rp_ip { type: http, interval: 86400, behavior: ipcidr }
  rp_classical:
    &rp_classical { type: http, interval: 86400, behavior: classical }

# 定义 Rule Providers
rule-providers:
  adblockmihomolite:
    <<: *rp_domain
    format: mrs
    url: 'https://fastly.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockmihomolite.mrs'
    path: './ruleset/adblockmihomolite.mrs'
  DownloadApps:
    <<: *rp_classical
    format: text
    url: 'https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Rules/DownloadApps.txt'
    path: './ruleset/DownloadApps.txt'
  fakeip_filter:
    <<: *rp_domain
    format: mrs
    url: 'https://fastly.jsdelivr.net/gh/wwqgtxx/clash-rules@release/fakeip-filter.mrs'
    path: './ruleset/fakeip-filter.mrs'
  cn:
    <<: *rp_domain
    format: mrs
    url: 'https://fastly.jsdelivr.net/gh/wwqgtxx/clash-rules@release/direct.mrs'
    path: './ruleset/cn.mrs'
  cn_ip:
    <<: *rp_ip
    format: mrs
    url: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs'
    path: './ruleset/cn_ip.mrs'

# --- 策略组 (Proxy Groups) ---

# 策略组通用配置
group_common_select:
  &group_common_select {
    type: select,
    interval: 600,
    timeout: 3000,
    max-failed-times: 3,
    url: 'https://g.cn/generate_204',
    lazy: true,
  }

group_common_auto:
  &group_common_auto {
    type: url-test,
    interval: 600,
    timeout: 3000,
    max-failed-times: 3,
    url: 'https://g.cn/generate_204',
    lazy: true,
    tolerance: 100,
    include-all: true,
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png',
    hidden: true,
  }

# 通用代理节点组
prox_common:
  &proxies {
    proxies:
      [
        '默认代理',
        '香港',
        '日本',
        '美国',
        '新加坡',
        '台湾省',
        '低倍率节点',
        '高倍率节点',
        '其他节点',
      ],
  }

# 定义分流策略组
proxy-groups:
  - name: '默认代理'
    <<: *group_common_select
    proxies:
      [
        '香港',
        '日本',
        '美国',
        '新加坡',
        '台湾省',
        '低倍率节点',
        '高倍率节点',
        '其他节点',
      ]
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'

  # 定义地区策略组
  - name: '香港'
    <<: *group_common_select
    include-all: true
    proxies: ['香港-自动选择']
    filter: '🇭🇰|港|HK|[Hh]ong\s*[Kk]ong'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png'
  - name: '香港-自动选择'
    <<: *group_common_auto
    filter: '🇭🇰|港|HK|[Hh]ong\s*[Kk]ong'

  - name: '日本'
    <<: *group_common_select
    include-all: true
    proxies: ['日本-自动选择']
    filter: '🇯🇵|日本|JP|[Jj]apan'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png'
  - name: '日本-自动选择'
    <<: *group_common_auto
    filter: '🇯🇵|日本|JP|[Jj]apan'

  - name: '美国'
    <<: *group_common_select
    include-all: true
    proxies: ['美国-自动选择']
    filter: '🇺🇸|美|US|[Aa]merica|[Uu]nited\s*[Ss]tates'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png'
  - name: '美国-自动选择'
    <<: *group_common_auto
    filter: '🇺🇸|美|US|[Aa]merica|[Uu]nited\s*[Ss]tates'

  - name: '新加坡'
    <<: *group_common_select
    include-all: true
    proxies: ['新加坡-自动选择']
    filter: '🇸🇬|新加坡|狮城|SG|[Ss]ingapore'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png'
  - name: '新加坡-自动选择'
    <<: *group_common_auto
    filter: '🇸🇬|新加坡|狮城|SG|[Ss]ingapore'

  - name: '台湾省'
    <<: *group_common_select
    include-all: true
    proxies: ['台湾省-自动选择']
    filter: '🇹🇼|台湾|TW|[Tt]aiwan'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png'
  - name: '台湾省-自动选择'
    <<: *group_common_auto
    filter: '🇹🇼|台湾|TW|[Tt]aiwan'

  - name: '低倍率节点'
    <<: *group_common_select
    include-all: true
    filter: '^(?!.*(?:剩|期|客户端|软件)).*(?:(?<!\d)0\.[0-5]|下载|低倍)'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png'

  - name: '高倍率节点'
    <<: *group_common_select
    include-all: true
    filter: '(?u)(?:[*×xX✕✖⨉]\s*(?:[2-9]\d*|[1-9]\d+)(?:\.\d+)?)|(?:(?<![\d.])(?:[2-9]\d*|[1-9]\d+)(?:\.\d+)?\s*(?:倍|[*×xX✕✖⨉]))'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png'

  - name: '其他节点'
    <<: *group_common_select
    include-all: true
    proxies: ['其他节点-自动选择']
    exclude-filter: '港|HK|🇭🇰|日本|JP|🇯🇵|美|US|🇺🇸|新加坡|SG|🇸🇬|台湾|TW|🇹🇼|'
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png'
  - name: '其他节点-自动选择'
    <<: *group_common_auto
    exclude-filter: '港|HK|🇭🇰|日本|JP|🇯🇵|美|US|🇺🇸|新加坡|SG|🇸🇬|台湾|TW|🇹🇼|'

# --- 路由规则 (Rules) ---
rules:
  - IP-CIDR,168.138.206.143/32,默认代理,no-resolve
  - IP-CIDR,161.33.168.82/32,默认代理,no-resolve
  - DOMAIN-SUFFIX,dpdns.org,其他节点
  - DOMAIN-SUFFIX,workers.dev,默认代理

  # 兜底规则
  - MATCH,默认代理
